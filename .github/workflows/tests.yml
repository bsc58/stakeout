name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # the oldest Python Stakeout runs on (MIN_PYTHON in stakeout.py) and the newest; on Windows also the
        # newest's free-threaded build, which the Python launcher there may have as its default
        python: ["3.12", "3.14"]
        include:
          - os: windows-latest
            python: "3.14t"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      # Read as bytes: grep on Windows drops the CR before matching and cannot see line endings.
      - name: Line endings as checked out (phone scripts Unix, Windows launcher Windows)
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          unix = sorted(Path("aw/phone").glob("*.sh")) + [Path("Stakeout.command")]
          bad = [str(p) for p in unix if b"\r" in p.read_bytes()]
          bat = Path("Stakeout.bat").read_bytes()
          if bat.count(b"\n") != bat.count(b"\r\n"):
              bad.append("Stakeout.bat")
          print(f"{len(unix)} Unix files checked, Stakeout.bat: {bat.count(b'\r\n')} CRLF lines")
          raise SystemExit(f"wrong line endings: {bad}" if bad else 0)
          EOF

  # Stakeout.exe, the Windows launcher with the icon: built with the C# compiler that comes with Windows,
  # then started for real (the page must answer), and kept as a download of the run.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Stakeout.exe
        shell: powershell
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:exe /optimize+ /win32icon:launcher\icon.ico /out:Stakeout.exe launcher\Stakeout.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-Item Stakeout.exe).VersionInfo | Format-List ProductName, FileVersion
      - name: Stakeout.exe has the icon and opens the page
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\Stakeout.exe").ToBitmap().Save("$PWD\exe-icon.png")
          Write-Output ("py launcher on this machine: " + [bool](Get-Command py -ErrorAction SilentlyContinue))
          # Python holds back output that goes to a file; the test kills it, so it must not.
          $env:PYTHONUNBUFFERED = '1'
          $p = Start-Process -FilePath .\Stakeout.exe -ArgumentList '--no-open', '--port', '8799' -PassThru `
               -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 500
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/).StatusCode -eq 200 } catch {}
          }
          taskkill /T /F /PID $p.Id | Out-Null
          $out = [IO.File]::ReadAllText("$PWD\out.txt", [Text.Encoding]::UTF8)
          $err = [IO.File]::ReadAllText("$PWD\err.txt", [Text.Encoding]::UTF8)
          [Console]::Out.WriteLine("page answered: $ok")
          [Console]::Out.WriteLine("stdout: " + ($out -replace 'token=[\w-]+', 'token=...'))
          [Console]::Out.WriteLine("stderr: " + $err)
          if (-not $ok) { throw 'the page did not answer' }
          if ($out -notmatch 'http://127\.0\.0\.1:8799/\?token=') { throw 'no page address printed' }
          [Console]::Out.WriteLine('Stakeout.exe started Stakeout and the page answered')
      - uses: actions/upload-artifact@v4
        with:
          name: Stakeout-exe
          path: |
            Stakeout.exe
            exe-icon.png
